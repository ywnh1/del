[package]
name = "del"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "unicode", "cargo", "color"] }
crossterm = "0.29"
dirs-next = "2.0"
figment = { version = "0.10", features = ["toml", "env"] }
humantime = "2.4"
minus = { version = "5.7", features = ["search", "static_output"] }
ratatui = "0.30"
rayon = "1.12"
rusqlite = { version = "0.40", features = ["bundled", "load_extension"] }
serde = { version = "1.0", features = ["derive"] }
tabled = "0.22"
tar = "0.4"
zstd = "0.14"
